name: Temporary Daily Income APK Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'daily-income-build/**'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode Daily Income source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/daily-income"
          base64 -d daily-income-build/project.tar.gz.b64 > "$RUNNER_TEMP/daily-income-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/daily-income-source.tar.gz" -C "$RUNNER_TEMP/daily-income"
          test -f "$RUNNER_TEMP/daily-income/app/build.gradle"

      - name: Compile installable debug APK
        shell: bash
        working-directory: ${{ runner.temp }}/daily-income
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Package verification files
        shell: bash
        run: |
          set -euxo pipefail
          APK="$RUNNER_TEMP/daily-income/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p artifact
          cp "$APK" artifact/Daily-Income-v0.1.0-android.apk
          sha256sum artifact/Daily-Income-v0.1.0-android.apk | tee artifact/SHA256.txt
          {
            echo "Daily Income Android MVP"
            echo "Application ID: com.arboris.dailyincome"
            echo "Version: 0.1.0"
            echo "Minimum SDK: 23 (Android 6+)"
            echo "Target SDK: 35"
            echo "Offline core: SQLite"
            echo "Optional network: in-app opportunity feed refresh"
            echo
            if command -v aapt >/dev/null 2>&1; then
              aapt dump badging "$APK" || true
              echo
              aapt dump permissions "$APK" || true
            elif command -v apkanalyzer >/dev/null 2>&1; then
              apkanalyzer manifest application-id "$APK" || true
              apkanalyzer manifest min-sdk "$APK" || true
              apkanalyzer manifest target-sdk "$APK" || true
              apkanalyzer manifest permissions "$APK" || true
            fi
          } > artifact/BUILD-VERIFY.txt
          cp "$RUNNER_TEMP/daily-income-source.tar.gz" artifact/daily-income-source.tar.gz

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-income-apk
          path: artifact/*
          if-no-files-found: error
          retention-days: 7
